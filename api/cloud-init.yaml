#cloud-config

# DNS setup (do this AFTER the server is created and you have its IP):
#   1. Go to Cloudflare dashboard for thathsara.lk
#   2. Update the A record: thathsara.lk → <server-public-ip>  (orange proxy cloud ON)
#   3. Cloudflare handles HTTPS — no cert needed on this server
#
# Deploy command:
#   hcloud server create \
#     --name thathsara-lk \
#     --type cx22 \
#     --image ubuntu-24.04 \
#     --ssh-key <your-key-name> \
#     --user-data-from-file api/cloud-init.yaml
#
# Before running the above, build and push the image:
#   docker build -t docker.io/<your-dockerhub-username>/thathsara-lk:latest .
#   docker push docker.io/<your-dockerhub-username>/thathsara-lk:latest
#
# To redeploy (image update only, no new server):
#   ssh root@<server-ip> "docker pull docker.io/<your-dockerhub-username>/thathsara-lk:latest && \
#     docker stop thathsara-lk && docker rm thathsara-lk && \
#     docker run -d --name thathsara-lk --restart unless-stopped -p 80:80 \
#     docker.io/<your-dockerhub-username>/thathsara-lk:latest"

packages:
  - docker.io

runcmd:
  - systemctl enable --now docker
  - docker pull docker.io/DOCKERHUB_USERNAME/thathsara-lk:latest
  - docker run -d
    --name thathsara-lk
    --restart unless-stopped
    -p 80:80
    docker.io/DOCKERHUB_USERNAME/thathsara-lk:latest
