server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pagefind search assets
    location /pagefind/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Astro-generated assets (hashed filenames)
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Music and other public assets
    location /music/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA-style fallback for Astro pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cloudflare sends real IPs in this header
    real_ip_header CF-Connecting-IP;
}
